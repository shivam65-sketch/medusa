# MEDUSA lakehouse: backfill.
# Loads a range of past days into the landing volume, one job per day, four at a time.
# Started by hand from GitHub's Actions tab with a first and last day. Every day is loaded by the
# same reusable workflow as the daily load, and loading a day twice is harmless.
name: Lakehouse backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day, YYYY-MM-DD"
        required: true
      end:
        description: "Last day, YYYY-MM-DD (at most 60 days after the first)"
        required: true

# The jobs only read the repository (and the log job this run's jobs); they never write to GitHub.
permissions:
  contents: read
  actions: read

# Never run two backfills at the same time.
concurrency:
  group: lakehouse-backfill
  cancel-in-progress: false

jobs:
  # Turns the two dates into a list of days for the next job.
  days:
    runs-on: ubuntu-latest
    outputs:
      dates: ${{ steps.list.outputs.dates }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - id: list
        name: List the days
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        shell: python
        run: |
          import datetime as dt, json, os
          start = dt.date.fromisoformat(os.environ["START"])
          end = dt.date.fromisoformat(os.environ["END"])
          days = (end - start).days + 1
          if not 1 <= days <= 60:
              raise SystemExit("Pick a range of 1 to 60 days, with the first day before the last.")
          dates = [(start + dt.timedelta(n)).isoformat() for n in range(days)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("dates=" + json.dumps(dates) + "\n")
          print(f"{days} days: {dates[0]} to {dates[-1]}")

  # One job per day, four at a time; one failed day doesn't stop the others.
  # Each job uploads 4 files at a time, so all four together send no more than one daily load
  # (16 at once). With 16 each, Databricks turned the uploads away.
  load:
    needs: days
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        date: ${{ fromJSON(needs.days.outputs.dates) }}
    uses: ./.github/workflows/lakehouse-load-day.yml
    with:
      date: ${{ matrix.date }}
      upload_concurrency: 4
    secrets: inherit

  # Once every day has uploaded: bronze, then dbt. If a day failed, this doesn't run; re-run the
  # failed day, then start "Lakehouse transform" by hand.
  transform:
    needs: load
    uses: ./.github/workflows/lakehouse-transform.yml
    secrets: inherit

  # Last, whatever happened: one row per job of this run in ops.logs.pipeline_events (step 31).
  log:
    needs: [days, load, transform]
    if: ${{ always() }}
    uses: ./.github/workflows/lakehouse-log-run.yml
    secrets: inherit
