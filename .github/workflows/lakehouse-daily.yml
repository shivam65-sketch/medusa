# MEDUSA lakehouse: daily load.
# Every day at 06:00 UTC, loads yesterday's Binance futures files into the Databricks landing
# volume. The steps themselves are in lakehouse-load-day.yml. Runs on GitHub's servers.
name: Lakehouse daily load

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC, after Binance has published yesterday's files
  workflow_dispatch:       # adds a "Run workflow" button on GitHub
    inputs:
      date:
        description: "Day to load, YYYY-MM-DD (leave empty for yesterday)"
        required: false
        default: ""

# The job only reads the repository; it never writes to it.
permissions:
  contents: read

# Never run two daily loads at the same time.
concurrency:
  group: lakehouse-daily-load
  cancel-in-progress: false

jobs:
  load:
    uses: ./.github/workflows/lakehouse-load-day.yml
    with:
      date: ${{ inputs.date || '' }}
    secrets: inherit
