# MEDUSA lakehouse: transform (a reusable workflow, also runnable by hand).
# Loads new landing files into bronze (the Lakeflow pipeline), checks bronze is fresh, builds and
# tests silver and gold with dbt, then copies the live scanner's gold tables into MEDUSA. The daily
# load and the backfill run it after their uploads.
name: Lakehouse transform

on:
  workflow_call:
  workflow_dispatch:   # "Run workflow" button: run bronze and dbt without downloading anything

# The job only reads the repository; it never writes to it.
permissions:
  contents: read

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lakehouse
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      MEDUSA_URL: ${{ secrets.MEDUSA_URL }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install the Databricks CLI
        uses: databricks/setup-cli@v1.21.0

      # Runs the bronze pipeline already deployed from databricks.yml; Auto Loader reads only new files.
      - name: Load new landing files into bronze
        run: databricks bundle run bronze

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lakehouse/dbt/requirements.txt

      - name: Install dbt
        run: pip install -r dbt/requirements.txt

      # dbt's connection comes from environment variables (dbt/profiles.yml). The host comes from the
      # DATABRICKS_HOST secret, and the warehouse's HTTP path is looked up by its name, so no address
      # or id is stored in the repository. Both are masked so they never show in the public log.
      - name: Connection details for dbt
        run: |
          host="${DATABRICKS_HOST#https://}"
          host="${host%/}"
          path=$(databricks warehouses list -o json | python -c "import json, sys; print(next(w['odbc_params']['path'] for w in json.load(sys.stdin) if w['name'] == 'Serverless Starter Warehouse'))")
          echo "::add-mask::$host"
          echo "::add-mask::$path"
          echo "DBT_DATABRICKS_HOST=$host" >> "$GITHUB_ENV"
          echo "DBT_DATABRICKS_HTTP_PATH=$path" >> "$GITHUB_ENV"

      # Stops the run (and sends GitHub's failure email) if bronze hasn't received data for 72 hours.
      - name: Check bronze is fresh
        working-directory: lakehouse/dbt
        env:
          DBT_ENV_SECRET_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: dbt source freshness

      - name: Build and test silver and gold
        working-directory: lakehouse/dbt
        env:
          DBT_ENV_SECRET_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: dbt build

      # Only after every test passed: copy coin_baseline and event_evidence into MEDUSA through its
      # write-only endpoint, then check MEDUSA holds exactly as many rows as gold (ADR-024). Skipped
      # where MEDUSA isn't set up (no MEDUSA_URL secret).
      - name: Publish to MEDUSA
        if: ${{ env.MEDUSA_URL != '' }}
        env:
          MEDUSA_INGEST_TOKEN: ${{ secrets.MEDUSA_INGEST_TOKEN }}
        run: python serving/publish_to_medusa.py
