# MEDUSA lakehouse: everything Databricks runs, defined as code.
# Deploy with `databricks bundle deploy`, run a job with `databricks bundle run <job>`.
bundle:
  name: medusa-lakehouse

variables:
  warehouse_id:
    description: The SQL warehouse that runs the SQL tasks. Found by name, so no ids live in Git.
    lookup:
      warehouse: Serverless Starter Warehouse

# One target: Free Edition has a single workspace. The workspace address comes from
# your CLI profile (~/.databrickscfg), not from this file.
targets:
  prod:
    default: true

resources:
  jobs:
    setup_ddl:
      name: lakehouse-setup-ddl
      description: Creates the catalogs (market, ops, journal), the layer schemas with their descriptions and tags, the landing volume, the metric definitions tables (shared and personal) and the ops log tables. Safe to run again.
      tasks:
        - task_key: create_catalog
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/ddl/001_catalog.sql

        - task_key: create_schemas
          depends_on:
            - task_key: create_catalog
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/ddl/002_schemas.sql

        - task_key: create_volumes
          depends_on:
            - task_key: create_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/ddl/003_volumes.sql

        - task_key: create_semantic
          depends_on:
            - task_key: create_schemas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/ddl/004_semantic.sql

        - task_key: create_user_metrics
          depends_on:
            - task_key: create_semantic
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/ddl/005_user_metrics.sql

        - task_key: create_layout
          depends_on:
            - task_key: create_user_metrics
            - task_key: create_volumes
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/ddl/006_layout.sql

        - task_key: create_ops_logs
          depends_on:
            - task_key: create_layout
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/ddl/007_ops_logs.sql

        - task_key: create_etl_logs
          depends_on:
            - task_key: create_ops_logs
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/ddl/008_etl_logs.sql

    ops_views:
      name: lakehouse-ops-views
      description: Creates the ops views that read the bronze pipeline's own event log (ops.logs.bronze_loads). Run after setup_ddl and the first bronze run. Safe to run again.
      tasks:
        - task_key: bronze_loads
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/ops/001_bronze_loads.sql

    tag_tables:
      name: lakehouse-tag-tables
      description: Tags the bronze and semantic tables (domain, layer, personal_data); dbt tags silver and gold itself. Run after setup_ddl and the first bronze run. Safe to run again.
      tasks:
        - task_key: tag_tables
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/governance/001_table_tags.sql

    seed_metric_definitions:
      name: lakehouse-seed-metric-definitions
      description: Loads version 1 of the Markets page's metric definitions (Today, then Patterns, then Insights). Safe to run again (it only adds what is missing).
      tasks:
        - task_key: seed_v1
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/001_metric_definitions_v1.sql
        - task_key: seed_patterns
          depends_on:
            - task_key: seed_v1
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/002_metric_definitions_patterns.sql
        - task_key: seed_insights
          depends_on:
            - task_key: seed_patterns
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/003_metric_definitions_insights.sql
        - task_key: seed_market_type
          depends_on:
            - task_key: seed_insights
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/004_metric_definitions_market_type.sql
        - task_key: seed_market_filter
          depends_on:
            - task_key: seed_market_type
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/005_metric_definitions_market_filter.sql
        - task_key: seed_moves_and_hours
          depends_on:
            - task_key: seed_market_filter
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/006_metric_definitions_moves_and_hours.sql
        - task_key: seed_no_hours
          depends_on:
            - task_key: seed_moves_and_hours
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/007_metric_definitions_no_hours.sql
        - task_key: seed_playbook
          depends_on:
            - task_key: seed_no_hours
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/008_metric_definitions_playbook.sql
        - task_key: seed_plain_words
          depends_on:
            - task_key: seed_playbook
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/009_metric_definitions_plain_words.sql
        - task_key: seed_names_and_clicks
          depends_on:
            - task_key: seed_plain_words
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/010_metric_definitions_names_and_clicks.sql
        - task_key: seed_value_windows
          depends_on:
            - task_key: seed_names_and_clicks
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/011_metric_definitions_value_windows.sql
        - task_key: seed_aggregates_only
          depends_on:
            - task_key: seed_value_windows
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/seed/012_metric_definitions_aggregates_only.sql

  # Bronze: loads new landing files into market.bronze. Runs when started, then stops.
  pipelines:
    bronze:
      name: lakehouse-bronze
      catalog: market
      schema: bronze
      serverless: true
      continuous: false
      channel: CURRENT
      libraries:
        - file:
            path: ./pipelines/bronze/klines_1m.sql
        - file:
            path: ./pipelines/bronze/metrics.sql
        - file:
            path: ./pipelines/bronze/klines_1h.sql