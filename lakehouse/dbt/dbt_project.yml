# MEDUSA lakehouse: the dbt project that builds the silver and gold layers.
name: medusa_lakehouse
version: "1.0.0"
profile: medusa_lakehouse

model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

# Each folder of models writes to the schema of the same name in the market catalog.
# persist_docs writes every description in the YAML files into Databricks as the table's and each
# column's comment, so Catalog Explorer explains every table (lakehouse step 30). databricks_tags
# labels each table with its domain, layer and whether it holds personal data.
models:
  medusa_lakehouse:
    +persist_docs:
      relation: true
      columns: true
    +databricks_tags:
      domain: market
      personal_data: "false"
    silver:
      +schema: silver
      +databricks_tags:
        layer: silver
    gold:
      +schema: gold
      +databricks_tags:
        layer: gold

snapshots:
  medusa_lakehouse:
    +persist_docs:
      relation: true
      columns: true
    +databricks_tags:
      domain: market
      layer: silver
      personal_data: "false"

# Settings for the live scanner's evidence (intraday_events, event_evidence). Changing one needs
# a rebuild of those two tables, which happens on every run anyway.
vars:
  event_z: 3                     # a move is unusual at |z| >= 3, as in unusual_moves
  round_trip_cost: 0.001         # fees and slippage to enter and leave once: 0.10%
  held_back_from: "2025-01-01"   # events from this day on play no part in choosing a side
  evidence_min_days: 20          # fewer days than this in either period: 'too few'
  evidence_min_t: 2              # |t| needed in-sample, and on the chosen side when held back

# Don't send dbt Labs anonymous usage statistics.
flags:
  send_anonymous_usage_stats: false