version: 2

models:
  - name: coin_daily
    description: >
      Gold: one row per coin per UTC day, the main table the dashboards read. Built from the
      silver hourly and 1-minute candles and the 5-minute metrics. Returns and changes are
      fractions (0.05 = +5%). Incremental: each run rebuilds the days that got new candles and
      the day after each of them.
    columns:
      - name: symbol
        description: Binance symbol, e.g. BTCUSDT. Join dim_coin for the base asset and status.
        data_tests: [not_null]
      - name: trade_date
        description: The UTC day.
        data_tests: [not_null]
      - name: open
        description: First price of the day (00:00 UTC), USDT.
        data_tests: [not_null]
      - name: high
        description: Highest price of the day.
        data_tests: [not_null]
      - name: low
        description: Lowest price of the day.
        data_tests: [not_null]
      - name: close
        description: Last price of the day (23:59 UTC).
        data_tests: [not_null]
      - name: return_1d
        description: close / previous day's close - 1. Empty on a coin's first day and after a gap.
      - name: range_1d
        description: (high - low) / open, how wide the day's range was.
      - name: volume
        description: Amount traded in the day, in the coin.
        data_tests: [not_null]
      - name: quote_volume
        description: Amount traded in the day, in USDT.
      - name: trades
        description: Number of trades in the day.
        data_tests: [not_null]
      - name: taker_buy_share
        description: Share of the volume that was aggressive buying (0 to 1); empty when nothing traded.
      - name: realized_volatility_1d
        description: Square root of the sum of squared 1-minute log returns within the day (not annualised).
      - name: max_move_1m
        description: The biggest single 1-minute price move in the day, up or down, as a fraction.
      - name: open_interest_open_usdt
        description: Open interest at the day's first 5-minute snapshot, USDT. Empty when Binance has no metrics for the coin.
      - name: open_interest_close_usdt
        description: Open interest at the day's last snapshot, USDT.
      - name: open_interest_change_1d
        description: open_interest_close_usdt / open_interest_open_usdt - 1.
      - name: avg_taker_buy_sell_ratio
        description: Average of the 5-minute aggressive buy / sell volume ratios.
      - name: avg_top_trader_position_ratio
        description: Average of the 5-minute top-trader long / short position ratios.
      - name: avg_account_long_short_ratio
        description: Average of the 5-minute all-account long / short ratios.
      - name: minutes
        description: 1-minute candles behind the day; 1,440 when complete.
        data_tests: [not_null]
      - name: zero_volume_minutes
        description: Minutes in the day with no trades.
      - name: metric_snapshots
        description: 5-minute metric snapshots behind the day; 288 when complete, 0 when none.
      - name: last_bronze_loaded_at
        description: Newest bronze load time behind the day; incremental runs start from it.

  - name: market_daily
    description: >
      Gold: the whole market, one row per UTC day, built from coin_daily (rebuilt every run).
      Only coins that traded that day are counted; delisted contracts that still get flat,
      zero-volume candles are counted in coins_inactive. Returns and shares are fractions.
    columns:
      - name: trade_date
        description: The UTC day.
        data_tests: [unique, not_null]
      - name: coins
        description: Coins that traded that day (at least one trade).
        data_tests: [not_null]
      - name: coins_inactive
        description: Coins with candles but no trades that day, mostly contracts Binance has delisted ("settling").
        data_tests: [not_null]
      - name: coins_up
        description: Traded coins whose close was above the previous day's close.
      - name: coins_down
        description: Traded coins whose close was below the previous day's close.
      - name: coins_flat
        description: Traded coins whose close didn't change.
      - name: breadth
        description: coins_up / (coins_up + coins_down); 0.5 means as many up as down. Empty on the first day.
      - name: coins_moved_20pct
        description: Coins that rose or fell 20% or more.
      - name: median_return_1d
        description: The middle coin's return (equal weight).
      - name: volume_weighted_return_1d
        description: Returns weighted by each coin's USDT volume.
      - name: median_realized_volatility_1d
        description: The middle coin's realised volatility.
      - name: quote_volume
        description: USDT traded across all coins.
      - name: btc_volume_share
        description: Bitcoin's share of the day's USDT volume.
      - name: taker_buy_share
        description: Volume-weighted share of aggressive buying across all coins.
      - name: open_interest_usdt
        description: Total open interest at the day's last snapshot, USDT (coins with metrics only).
      - name: btc_return_1d
        description: Bitcoin's return that day.
      - name: eth_return_1d
        description: Ethereum's return that day.

  - name: data_health
    description: >
      Gold: is each day's data complete? One row per UTC day, built from coin_daily (rebuilt every
      run). Feeds the dashboard's Data health page.
    columns:
      - name: trade_date
        description: The UTC day.
        data_tests: [unique, not_null]
      - name: coins
        description: Coins with candles that day, including inactive ones.
      - name: coins_inactive
        description: Coins with candles but not a single trade that day (delisted contracts still get flat candles).
      - name: coins_complete_candles
        description: Coins with all 1,440 minutes.
      - name: coins_incomplete_candles
        description: Coins with fewer than 1,440 minutes.
      - name: missing_minutes
        description: Minutes missing across all coins.
      - name: coins_with_metrics
        description: Coins with at least one 5-minute metric snapshot.
      - name: coins_complete_metrics
        description: Coins with all 288 snapshots.
      - name: coins_incomplete_metrics
        description: Coins with some, but not all, snapshots.
      - name: missing_metric_snapshots
        description: Snapshots missing across the coins that have metrics.
      - name: coins_new
        description: Coins with no row the day before (every coin counts as new on the first day).
      - name: coins_dropped
        description: Coins that traded the day before but have no row this day.
      - name: last_loaded_at
        description: Newest bronze load time behind the day.
      - name: candle_status
        description: complete when every coin has all its minutes and none dropped out; otherwise check.
        data_tests:
          - accepted_values:
              arguments:
                values: ['complete', 'check']

  - name: unusual_moves
    description: >
      Gold: coin-days that were unusual for that coin, compared with the coin's own previous 30
      trading days (z-scores). Unusual = return, volume (log scale) or realised volatility 3 or more
      standard deviations from normal. Needs at least 20 days of history. Rebuilt every run.
    columns:
      - name: symbol
        description: Binance symbol.
        data_tests: [not_null]
      - name: trade_date
        description: The UTC day.
        data_tests: [not_null]
      - name: return_1d
        description: The day's return (fraction).
      - name: return_z
        description: How many standard deviations the return was from the coin's 30-day average.
      - name: quote_volume
        description: USDT traded that day.
      - name: volume_z
        description: Standard deviations of log volume above or below the 30-day average.
      - name: realized_volatility_1d
        description: The day's realised volatility.
      - name: volatility_z
        description: Standard deviations of realised volatility from the 30-day average.
      - name: taker_buy_share
        description: Share of the volume that was aggressive buying.
      - name: history_days
        description: Days of history the scores are based on (20 to 30).
      - name: reasons
        description: Why the day is unusual, e.g. 'big rise, volume surge, volatility spike'.
        data_tests: [not_null]

  - name: hour_profile
    description: >
      Gold: each coin's hour-of-day pattern over its whole history, one row per coin per UTC hour.
      Rebuilt every run from fct_candle_1h.
    columns:
      - name: symbol
        description: Binance symbol.
        data_tests: [not_null]
      - name: utc_hour
        description: Hour of the day, 0 to 23 (UTC).
        data_tests: [not_null]
      - name: days
        description: Days of history behind the row.
      - name: first_date
        description: First day in the history.
      - name: last_date
        description: Last day in the history.
      - name: avg_return
        description: Average return within the hour (close / open - 1).
      - name: sd_return
        description: Standard deviation of the hour's returns.
      - name: t_stat_return
        description: avg_return / (sd_return / sqrt(days)). Roughly, below 2 either way could easily be chance.
      - name: avg_abs_return
        description: Average size of the hour's move, up or down.
      - name: avg_volume_share
        description: Average share of the day's volume traded in this hour.
      - name: avg_quote_volume
        description: Average USDT traded in this hour.
      - name: avg_taker_buy_share
        description: Average share of aggressive buying in this hour.

  - name: hour_drift
    description: >
      Gold: the whole market's move in each UTC hour, judged by days, one row per year, period, UTC
      hour and liquidity group (and all, every coin together), from January 2020 and delisted coins
      included. Each day's move in an hour is the average of every trading coin's return in it (each
      clipped to 10% either way); the statistics are over those days. The sums let rows be pooled
      exactly, which the Markets page's Insights graphs do. Rebuilt every run from int_candle_1h_all.
    columns:
      - name: year
        description: The UTC year of the days in the row.
        data_tests: [not_null]
      - name: period
        description: in_sample (before held_back_from, where a pattern is chosen) or held_back (from it on, where it is checked).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['in_sample', 'held_back']
      - name: utc_hour
        description: Hour of the day, 0 to 23 (UTC).
        data_tests: [not_null]
      - name: liquidity
        description: The coins' liquidity group, from each coin's average daily traded value over its previous 30 days (large is 100 million USDT a day or more, mid 10 million or more, small less), or all for every coin together.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['large', 'mid', 'small', 'all']
      - name: days
        description: Days behind the row, each one value (the market's move in that hour that day).
        data_tests: [not_null]
      - name: first_date
        description: First day in the row.
      - name: last_date
        description: Last day in the row.
      - name: coin_hours
        description: Coin-hours behind those days (how many coins traded in the hour, added up).
      - name: sum_return
        description: Sum of the days' moves, for pooling rows (mean = sum_return / days).
      - name: sum_sq_return
        description: Sum of the squared moves, for pooling rows (variance from it, sum_return and days).
      - name: up_days
        description: Days on which the market rose in this hour.
      - name: avg_return
        description: Average of the days' moves (0.0001 = 1 basis point).
      - name: sd_return
        description: Standard deviation of the days' moves.
      - name: t_stat
        description: avg_return / (sd_return / sqrt(days)). Roughly, below 2 either way could easily be chance, and with 24 hours a few pass by luck.

  - name: coin_baseline
    description: >
      Gold: each coin's "normal" as of its latest day, one row per coin, for MEDUSA's live scanner.
      Today's move = live price / last_close - 1; today's z-score = (today's move - avg_return_30d)
      / sd_return_30d, unusual at 3 or more. The window is the coin's last 30 days with trades, up to
      and including as_of_date. Rebuilt every run.
    columns:
      - name: symbol
        description: Binance symbol.
        data_tests: [unique, not_null]
      - name: base_asset
        description: The coin itself, from dim_coin, e.g. PEPE for 1000PEPEUSDT.
      - name: multiplier
        description: Coins per quoted unit, from dim_coin.
      - name: status
        description: trading or not trading, from dim_coin's current version.
        data_tests: [not_null]
      - name: as_of_date
        description: The coin's latest day with trades; the baseline is "as of" the end of this day.
        data_tests: [not_null]
      - name: last_close
        description: Close on as_of_date, the reference price for today's move.
        data_tests: [not_null]
      - name: history_days
        description: Daily returns behind the averages (0 to 30). The scanner scores a coin from 20, like unusual_moves.
      - name: avg_return_30d
        description: Average daily return over the window.
      - name: sd_return_30d
        description: Standard deviation of the daily return over the window.
      - name: avg_abs_return_30d
        description: Average size of a day's move, up or down.
      - name: avg_range_30d
        description: Average (high - low) / open.
      - name: avg_volatility_30d
        description: Average daily realised volatility.
      - name: sd_volatility_30d
        description: Standard deviation of daily realised volatility.
      - name: avg_quote_volume_30d
        description: Average USDT traded per day.
      - name: avg_log_volume_30d
        description: Average of ln(USDT traded per day).
      - name: sd_log_volume_30d
        description: Standard deviation of ln(USDT traded per day).
      - name: avg_abs_hour_return_30d
        description: Average size of a one-hour move on the same days, to compare with a round trip's fees.

  - name: intraday_events
    description: >
      Gold: every time a coin's move so far that day became unusual for it (|z| >= event_z), from
      January 2020 on, delisted coins included, with the price 1, 4 and 24 hours later. At most one
      row per coin-day: the first hour that crossed the line. Same rule as the live scanner:
      z = (close / previous day's close - 1 - avg_return_30d) / sd_return_30d over the coin's previous
      30 days with trades (at least 20). Rebuilt every run from int_candle_1h_all.
    columns:
      - name: symbol
        description: Binance symbol.
        data_tests: [not_null]
      - name: event_date
        description: The UTC day of the event.
        data_tests: [not_null]
      - name: event_hour
        description: Start of the first hour whose close was unusual (UTC).
        data_tests: [not_null]
      - name: hour_of_day
        description: 0 to 23, the UTC hour of event_hour.
      - name: direction
        description: up or down, the sign of z.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['up', 'down']
      - name: z
        description: (move_so_far - avg_return_30d) / sd_return_30d at event_hour.
        data_tests: [not_null]
      - name: z_band
        description: "Size of the move, from |z|: 3-4, 4-6 or 6+."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['3-4', '4-6', '6+']
      - name: liquidity
        description: From avg_quote_volume_30d. large is 100 million USDT a day or more, mid is 10 million or more, small is less.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['large', 'mid', 'small']
      - name: move_so_far
        description: Close of event_hour / prev_close - 1.
      - name: prev_close
        description: The coin's close the day before.
      - name: entry_price
        description: Close of event_hour, the price the forward returns start from.
        data_tests: [not_null]
      - name: history_days
        description: Daily returns behind the averages (20 to 30).
      - name: avg_return_30d
        description: Average daily return over the coin's previous 30 days with trades.
      - name: sd_return_30d
        description: Standard deviation of those daily returns.
      - name: avg_quote_volume_30d
        description: Average USDT traded per day over the same days.
      - name: fwd_return_1h
        description: Close 1 hour after event_hour / entry_price - 1; empty if that hour doesn't exist.
      - name: fwd_return_4h
        description: The same, 4 hours later.
      - name: fwd_return_24h
        description: The same, 24 hours later.
      - name: period
        description: in_sample before held_back_from (2025-01-01), held_back from then on.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['in_sample', 'held_back']

  - name: event_evidence
    description: >
      Gold: what moves like today's did next. One row per direction, z_band, liquidity and horizon
      (1, 4 or 24 hours), plus a row per direction and horizon with z_band and liquidity 'all'.
      Continuation is the forward return in the direction of the move (negative means it turned
      back). Averages, spreads and t-statistics are taken over days, not events, because coins
      move together. The side (follow or fade) is chosen on the in-sample years only and checked on
      the held-back years. Rebuilt every run from intraday_events.
    columns:
      - name: direction
        description: up or down.
        data_tests: [not_null]
      - name: z_band
        description: 3-4, 4-6, 6+, or all.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['3-4', '4-6', '6+', 'all']
      - name: liquidity
        description: large, mid, small, or all.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['large', 'mid', 'small', 'all']
      - name: horizon_hours
        description: 1, 4 or 24.
        data_tests: [not_null]
      - name: events
        description: Events with a forward return at this horizon, all years.
        data_tests: [not_null]
      - name: days
        description: Distinct days those events fell on.
      - name: avg_continuation
        description: Average over days of each day's average continuation, all years.
      - name: median_continuation
        description: Median continuation over events, all years.
      - name: hit_rate
        description: Share of events that kept going (continuation > 0), all years.
      - name: in_sample_events
        description: Events before held_back_from.
      - name: in_sample_days
        description: Days those events fell on.
      - name: in_sample_avg_continuation
        description: Day-weighted average continuation in-sample.
      - name: in_sample_t
        description: In-sample average / (standard deviation of day averages / sqrt(days)).
      - name: in_sample_hit_rate
        description: Share of in-sample events that kept going.
      - name: held_back_events
        description: Events from held_back_from on.
      - name: held_back_days
        description: Days those events fell on.
      - name: held_back_avg_continuation
        description: Day-weighted average continuation in the held-back years.
      - name: held_back_t
        description: The held-back t-statistic, computed the same way.
      - name: held_back_hit_rate
        description: Share of held-back events that kept going.
      - name: side
        description: follow if the in-sample average continuation is positive, fade if negative.
        data_tests:
          - accepted_values:
              arguments:
                values: ['follow', 'fade']
      - name: in_sample_net_after_cost
        description: The chosen side's in-sample average return minus round_trip_cost.
      - name: held_back_net_after_cost
        description: The chosen side's held-back average return minus round_trip_cost.
      - name: verdict
        description: >
          too few (under evidence_min_days days in either period), no pattern (in-sample |t| under
          evidence_min_t), held up (the chosen side has t >= evidence_min_t in the held-back years and
          beats the cost in both periods), or did not hold.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['too few', 'no pattern', 'did not hold', 'held up']
      - name: round_trip_cost
        description: The cost used, from the dbt var round_trip_cost.
